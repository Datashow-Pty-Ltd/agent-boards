worker_processes auto;

error_log /usr/local/openresty/nginx/logs/error.log warn;
pid /usr/local/openresty/nginx/logs/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /usr/local/openresty/nginx/conf/mime.types;
  default_type application/octet-stream;

  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 75m;
  resolver __DNS_RESOLVER__ ipv6=off valid=5s;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream agent_boards_web {
    zone agent_boards_web 64k;
    server __WEB_HOST__:5173 resolve;
  }

  upstream agent_boards_rest {
    zone agent_boards_rest 64k;
    server __REST_HOST__:3000 resolve;
  }

  upstream agent_boards_mcp {
    zone agent_boards_mcp 64k;
    server __MCP_HOST__:8080 resolve;
  }

  upstream agent_boards_intelligence {
    zone agent_boards_intelligence 64k;
    server __INTELLIGENCE_HOST__:8081 resolve;
  }

  server {
    listen 8080;
    server_name _;

    location = /health {
      access_log off;
      default_type application/json;
      return 200 '{"ok":true,"service":"agent-boards-gateway"}';
    }

    location = /api {
      return 308 /api/;
    }

    location /api/ {
      proxy_pass http://agent_boards_rest/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Prefer $http_prefer;
      proxy_buffering off;
    }

    location = /mcp/health {
      proxy_pass http://agent_boards_mcp/health;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
    }

    location = /intelligence {
      return 308 /intelligence/;
    }

    location /intelligence/ {
      proxy_pass http://agent_boards_intelligence/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }

    location /uploads {
      proxy_pass http://agent_boards_mcp;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }

    location = /mcp {
      proxy_pass http://agent_boards_mcp/mcp;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 86400s;
      proxy_send_timeout 86400s;
      chunked_transfer_encoding off;
    }

    location / {
      proxy_pass http://agent_boards_web;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }
  }
}
